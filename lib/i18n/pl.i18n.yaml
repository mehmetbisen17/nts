sentry:
  consent:
    title: Chcesz wesprzeć nts?
    description:
      question: Czy chciałbyś automatycznie wysyłać raporty o niespodziewanych błędach? To pomaga identyfikować i rozwiązywać problemy szybciej.
      scope: Te raporty mogą zawierać informacje o błędach i twoim urządzeniu. Przykładamy wszelki wysiłek aby odfiltrować dane personalne, ale część z nich może pozostać.
      currentlyOff: Jeżeli wyrazisz zgodę, raportowanie błędów będzie aktywne po restarcie aplikacji.
      currentlyOn: Jeżeli cofniesz zgodę, proszę zrestartować aplikację aby wdrożyć zmiany.
      learnMoreInPrivacyPolicy(rich): Więcej informacji na ${link(privacy policy)}.
    answers:
      yes: Tak
      no: Nie
      later: Zapytaj mnie później
