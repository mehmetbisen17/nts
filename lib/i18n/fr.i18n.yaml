sentry:
  consent:
    title: Aide à améliorer nts ?
    description:
      question: Voulez-vous signaler automatiquement des erreurs inattendues ? Cela aide à identifier et à corriger les problèmes plus rapidement.
      scope: Les rapports peuvent contenir des informations sur l'erreur et votre appareil. J'ai fait tout mon possible pour filtrer les données personnelles, mais certaines peuvent rester.
      currentlyOff: Si vous accordez le consentement, la déclaration d'erreur sera activée après le redémarrage de l'application.
      currentlyOn: Si vous révoquez le consentement, veuillez redémarrer l'application pour désactiver la déclaration d'erreur.
      learnMoreInPrivacyPolicy(rich): En savoir plus dans le ${link(privacy policy)}.
    answers:
      yes: Oui
      no: Non
      later: Demande-moi plus tard
