sentry:
  consent:
    title: Ajudar a melhorar nts?
    description:
      question: Você gostaria de reportar automaticamente erros inesperados? Isso me ajuda a identificar e corrigir erros mais rápido.
      scope: Os reportes podem conter informações sobre os erros e o seu dispositivo. Eu tentei o máximo possível remover todas as informações pessoais, mas algumas talvez continuem.
      currentlyOff: Se você dar consentimento, os reportes de erro serão ativados após a reinicialização do app.
      currentlyOn: Se você revogar o consentimento, por favor reinicie o app para desativar os reportes de erro.
      learnMoreInPrivacyPolicy(rich): "Veja mais em: ${link(privacy policy)}."
    answers:
      yes: Sim
      no: Não
      later: Me pergunte depois
