sentry:
  consent:
    title: Vuoi aiutarci a migliorare nts?
    description:
      question: Vuoi segnalare automaticamente gli errori imprevisti? Questo mi aiuta a identificare e risolvere i problemi più velocemente.
      scope: I resoconti potrebbero contenere informazioni sull'errore e sul tuo dispositivo. Ho fatto il possibile per rimuovere dati personali, ma alcuni potrebbero rimanere.
      currentlyOff: Se acconsenti, la segnalazione degli errori verrà abilitata dopo il riavvio dell'app.
      currentlyOn: Se revochi il consenso, riavvia l'app per disattivare la segnalazione degli errori.
      learnMoreInPrivacyPolicy(rich): Scopri di più in ${link(privacy policy)}.
    answers:
      yes: Sì
      no: No
      later: Chiedimelo più tardi
