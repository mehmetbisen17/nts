sentry:
  consent:
    title: Helfen, nts zu verbessern?
    description:
      question: Möchtest du unerwartete Fehler automatisch melden? Das hilft mir dabei, Fehler schneller zu erkennen und zu beheben.
      scope: Diese Berichte können Informationen über den Fehler und dein Gerät enthalten. Ich habe mein Bestes getan, um persönliche Daten herauszufiltern, allerdings könnten dennoch personenbezogene Daten enthalten sein.
      currentlyOff: Wenn du zustimmst, wird die Fehlerberichterstattung nach dem Neustarten der App aktiviert.
      currentlyOn: Falls du deine Zustimmung zurücknimmst, starte die App bitte neu, um die Fehlerberichterstattung zu deaktivieren.
      learnMoreInPrivacyPolicy(rich): Erfahre mehr in der ${link(Datenschutzrichtlinie)}.
    answers:
      yes: Ja
      no: Nein
      later: Später erneut fragen
