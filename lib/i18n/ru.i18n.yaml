sentry:
  consent:
    title: Поможете улучшить nts?
    description:
      question: Хотели бы вы автоматически сообщать о непредвиденных ошибках? Это помогает мне быстрее выявлять и устранять неполадки.
      scope: В отчётах может содержаться информация об ошибке и вашем устройстве. Я приложил все усилия, чтобы отфильтровать личные данные, но некоторые из них могут остаться.
      currentlyOff: Если вы дадите согласие, то после перезапуска приложения будут включены отчёты об ошибках.
      currentlyOn: Если вы отзовёте свое согласие, пожалуйста, перезапустите приложение, чтобы отключить отчёты об ошибках.
      learnMoreInPrivacyPolicy(rich): Узнайте больше в разделе ${link(privacy policy)}.
    answers:
      yes: Да
      no: Нет
      later: Спросить позже
