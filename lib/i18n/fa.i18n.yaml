  consent:
    description:
      learnMoreInPrivacyPolicy(rich): در لینک ${link(خط مشی رازداری)} بیشتر بیاموزید.
      question(OUTDATED): آیا دوست دارید به طور خودکار خطاهای غیر منتظره را گزارش کنید؟ این به من کمک می کند تا مسائل را سریعتر شناسایی و رفع کنم.
      scope(OUTDATED): گزارش ها ممکن است حاوی اطلاعاتی در مورد خطا و دستگاه شما باشد. من تمام تلاش خود را برای فیلتر کردن داده های شخصی کردم اما برخی ممکن است باقی بمانند.
      currentlyOff(OUTDATED): اگر رضایت دهید ، گزارش خطا پس از شروع مجدد برنامه فعال می شود.
      currentlyOn(OUTDATED): اگر رضایت را لغو کردید ، لطفاً برنامه را برای غیرفعال کردن گزارش خطا مجدداً راه اندازی کنید.
    answers:
      yes(OUTDATED): بله
      no(OUTDATED): هیچ
      later(OUTDATED): بعداً از من بپرس
    title(OUTDATED): به بهبود nts کمک می کنید؟
