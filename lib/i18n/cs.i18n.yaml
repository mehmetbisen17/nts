sentry:
  consent:
    title: Chcete pomoct vylepšit aplikaci nts?
    description:
      question: Chtěli byste automaticky nahlašovat neočekávané chyby? Pomohlo by mi to s rychlejší identifikací a opravou.
      scope: Hlášení mohou obsahovat informace o chybě a vašem zařízení. Dělal jsem, co bylo v mých silách, abych odfiltroval osobní data, ale i tak mohou některá zůstat.
      currentlyOff: Nahlašování chyb se v případě udělení souhlasu zapne po restartu aplikace.
      currentlyOn: Po odvolání souhlasu prosím restartujte aplikaci, abyste nahlašování chyb vypnuli.
      learnMoreInPrivacyPolicy(rich): Více se dozvíte v ${link(Zásadách ochrany osobních údajů)} (anglicky).
    answers:
      yes: Ano
      no: Ne
      later: Odložit na později
