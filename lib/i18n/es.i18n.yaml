sentry:
  consent:
    title: ¿Quieres mejorar nts?
    description:
      question: ¿Quieres enviar informes de errores de forma automática? Esto permite identificar y corregir fallos más rápido.
      scope: Los reportes pueden contener información acerca del error y su dispositivo. Me he esforzado por filtrar la información personal, pero es posible que queden restos.
      currentlyOff: Si aceptas, los informes de error se activarán al reiniciar la app.
      currentlyOn: En caso de retirar su consentimiento, reinicie la aplicación para desactivar el reporte de errores.
      learnMoreInPrivacyPolicy(rich): Aprenda más en ${link(privacy policy)}.
    answers:
      yes: Si
      no: No
      later: Perguntar después
